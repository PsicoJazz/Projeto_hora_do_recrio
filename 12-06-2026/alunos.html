<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: Arial, Helvetica, sans-serif;
        }
    
        body {
          background: rgb(232, 255, 241);
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
        }
    
        .login-box {
          background-color: #fffdf6;
          width: 800px; /* Aumentado para 700px igual ao padrão do app para caber os elementos lado a lado */
          padding: 35px 50px;
          border-radius: 20px; /* Padronizado para 20px igual ao app */
          box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
          text-align: center;
        }
    
        .login-box h1 {
          font-size: 40px;
          color: #333;
          margin-bottom: 8px;
        }
    
        .logo-text {
          font-size: 14px;
          color: #777;
          margin-bottom: 25px;
        }

        /* Estrutura flex para colocar Nome de um lado, RA e Senha do outro */
        .flex-container {
          display: flex;
          gap: 20px;
          margin-bottom: 22px;
        }

        /* Coluna da esquerda (Nome) e Coluna da direita (RA + Senha) */
        .col {
          flex: 1;
          display: flex;
          flex-direction: auto;
          gap: 18px; /* Espaçamento vertical entre os blocos internos */
        }
    
        .input-group {
          text-align: left;
        }
    
        .input-group label {
          display: block;
          margin-bottom: 6px;
          font-weight: bold;
          color: #444;
        }
    
        .input-group input {
          width: 100%;
          padding: 12px; /* Padronizado para 12px para inputs confortáveis */
          border: 1px solid #ccc;
          border-radius: 10px;
          font-size: 15px;
          outline: none;
          transition: 0.3s;
          background-color: white;
        }
    
        .input-group input:focus {
          border-color: rgb(104, 177, 30);
          box-shadow: 0 0 8px rgba(104, 177, 30, 0.3);
        }
    
        .btn {
          width: 100%;
          padding: 12px;
          border: none;
          border-radius: 10px;
          font-size: 16px;
          font-weight: bold;
          cursor: pointer;
          transition: 0.3s;
          margin-top: 8px;
        }
    
        .btn-entrar {
          background-color: rgb(104, 177, 30);
          color: white;
        }
    
        .btn-entrar:hover {
          background-color: rgb(85, 148, 20);
          transform: translateY(-2px);
        }
    
        .btn-voltar {
          background-color: #e0e0e0;
          color: #333;
        }
    
        .btn-voltar:hover {
          background-color: #cfcfcf;
        }


      </style>
</head>
<body>

    <form>
        <div class="login-box">
            <h1>Cadastrar alunos</h1>
            <p class="logo-text">Cadastre um aluno diretamente no sistema</p>
        
            <div class="flex-container">
                <!-- Coluna da Esquerda: Nome do Aluno -->
                <div class="col">
                    <div class="input-group">
                        <label for="name">Nome do aluno:</label>
                        <input type="text" id="name" name="nome" placeholder="Digite o nome completo" required style="padding: 12px 90px;">
                    </div>
                </div>
              
                <!-- Coluna da Direita: RA e Senha alinhados verticalmente -->
                <div class="col">
                    <div class="input-group">
                        <label for="ra">RA do aluno:</label>
                        <input type="text" id="ra" name="ra" placeholder="Ex: 123456" required>
                    </div>
              
                    <div class="input-group">
                        <label for="senha">Senha inicial:</label>
                        <input type="password" id="senha" name="senha" placeholder="Digite a senha" required>
                    </div>
                </div>
            </div>

            <!-- Botões de ação integrados ao padrão -->
            <div>
                <button type="submit" class="btn btn-entrar">Cadastrar Aluno</button>
                <br><br>
                <a href="homeAdm.html" class="btn btn-voltar" style="text-decoration: none; display: inline-block; text-align: center;">Voltar</a>

            </div>
        </div>
    </form>
    
</body>
</html>
